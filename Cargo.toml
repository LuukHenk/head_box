[package]
name = "head_box"
version = "0.0.1"
edition = "2021"


[dependencies]
bevy = { version = "0.15.2", features = ["dynamic_linking"] } # NOTE! REMOVE THE dynamic_linking BEFORE RELEASING THE GAME
bevy_rapier2d = {  version = "0.29.0", features = ["debug-render-2d"] }
rand = "0.9.0"

[lib]
name = "head_box"
path = "src/lib.rs"

[[bin]]
edition = "2021"
name = "head_box"
path = "src/bin/main.rs"

### {{{ BEVY CONFIGURATION

[workspace]
resolver = "2" # Important! wgpu/Bevy needs this!

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3


### }}} END BEVY CONFIGURATION
